<g fill="#f4f9fc" font-size="22" font-weight="700"><text x="150" y="326">Browser UI</text><text x="405" y="326">Redaction</text><text x="660" y="326">Moss</text><text x="915" y="326">Evidence gate</text><text x="1225" y="326">OpenAI + validator</text></g>
<g fill="#9eb8c8" font-size="15"><text x="150" y="360">Failed request</text><text x="150" y="384">Synthetic examples</text><text x="150" y="408">Result console</text><text x="405" y="360">Headers · JSON</text><text x="405" y="384">URLs · tokens</text><text x="405" y="408">Before providers</text><text x="660" y="360">19 curated notes</text><text x="660" y="384">Top-5 retrieval</text><text x="660" y="408">Measured latency</text><text x="915" y="360">Trusted text only</text><text x="915" y="384">Signal matching</text><text x="915" y="408">Abstain if weak</text><text x="1225" y="360">gpt-4o-mini</text><text x="1225" y="384">Strict JSON schema</text><text x="1225" y="408">Citation validation</text></g></g>
