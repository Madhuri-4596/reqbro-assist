<rect width="1440" height="820" rx="32" fill="url(#bg)"/><text x="70" y="82" fill="#f4f9fc" font-family="Arial" font-size="38" font-weight="700">ReqBro Assist</text><text x="70" y="116" fill="#8eabc0" font-family="monospace" font-size="16">EVIDENCE-GROUNDED API DEBUGGING PIPELINE</text>
